name: 'Create Terraform Backend Resources'
description: 'Cria os recursos necessários para o backend do Terraform (S3 e DynamoDB)'

runs:
  using: "composite"
  steps:
    - name: Create S3 Bucket
      shell: bash
      run: |
        aws s3api create-bucket --bucket terraform-state-bucket-dev-1746926346063 --region us-east-1 || true
        aws s3api put-bucket-versioning --bucket terraform-state-bucket-dev-1746926346063 --versioning-configuration Status=Enabled --region us-east-1

    - name: Create DynamoDB Table
      shell: bash
      run: |
        aws dynamodb create-table \
          --table-name terraform-state-table-lock-dev \
          --attribute-definitions AttributeName=LockID,AttributeType=S \
          --key-schema AttributeName=LockID,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST --region us-east-1 || true
