service: simple-lambda-app

frameworkVersion: "3"

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    STAGE: ${self:provider.stage}
    API_KEY: ${env:API_KEY, ''}

functions:
  hello:
    handler: handler.hello
    events:
      - httpApi:
          path: /hello
          method: get
